{% extends 'base.html' %}

{% block title %}Login — Web Shield{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">
      <div style="font-size: 3rem; margin-bottom: 12px;">🛡️</div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your Web Shield account</p>
    </div>

    <form method="post" id="login-form">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="id_username">Username</label>
        <input type="text" name="username" id="id_username" class="form-control"
               placeholder="Enter your username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="id_password">Password</label>
        <div style="position: relative;">
          <input type="password" name="password" id="id_password" class="form-control"
                 placeholder="Enter your password" required autocomplete="current-password">
          <button type="button" onclick="togglePassword('id_password', this)"
            style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; padding: 0;">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 btn-lg" id="login-submit" style="margin-top: 8px;">
        <i class="bi bi-box-arrow-in-right"></i> Sign In
      </button>
    </form>

    <div class="divider" style="margin: 24px 0;"></div>

    <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem;">
      Don't have an account?
      <a href="{% url 'register' %}" style="color: var(--accent-blue); text-decoration: none; font-weight: 600;" id="link-register">
        Create one free
      </a>
    </p>
  </div>
</div>

<script>
function togglePassword(inputId, btn) {
  var input = document.getElementById(inputId);
  if (input.type === 'password') {
    input.type = 'text';
    btn.innerHTML = '<i class="bi bi-eye-slash"></i>';
  } else {
    input.type = 'password';
    btn.innerHTML = '<i class="bi bi-eye"></i>';
  }
}
</script>
{% endblock %}
