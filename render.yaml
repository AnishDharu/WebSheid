services:
  - type: web
    name: webshield
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn webshield.wsgi:application"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.9"
